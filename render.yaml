services:
  - type: web
    name: grievanceai-two-portal
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: grievanceai-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEVELOPER_EMAIL
        sync: false
      - key: DEVELOPER_PASSWORD
        sync: false
      - key: DEVELOPER_NAME
        value: GrievanceAI Developer

databases:
  - name: grievanceai-db
    databaseName: grievanceai
    user: grievanceai_user
